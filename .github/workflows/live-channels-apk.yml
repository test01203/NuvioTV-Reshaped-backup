name: Live Channels APK

# The separate Ace Stream channels app (module :acetv), built and published on its own release.
on:
  push:
    branches:
      - feat/acestream-iptv
    paths:
      - "acetv/**"
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/live-channels-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-channels-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Signing key for the run
        run: |
          set -e
          touch local.properties local.dev.properties
          KEYSTORE_PATH="$RUNNER_TEMP/live.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" -storepass buildpass -keypass buildpass \
            -alias live -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Live Channels"
          {
            echo "LIVE_SIGNING_STORE_FILE=$KEYSTORE_PATH"
            echo "LIVE_SIGNING_STORE_PASSWORD=buildpass"
            echo "LIVE_SIGNING_KEY_ALIAS=live"
            echo "LIVE_SIGNING_KEY_PASSWORD=buildpass"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :acetv:assembleRelease --stacktrace 2>&1 | tee build.log || {
            # Compiler and build errors as annotations, readable without the full log.
            # Kotlin errors first, then Gradle's "What went wrong" with the lines under it.
            { grep -E "^e: " build.log | sed -E 's#^e: file://[^ ]*/(acetv/src/main/java|shared/src)/##''
              awk '/What went wrong/{n=4} n>0{print; n--}' build.log | grep -v "What went wrong"
              grep -iE "AAPT: error|error: resource|Execution failed" build.log; } \
              | grep -v "^> Task" | head -9 | while IFS= read -r line; do
              echo "::error::${line:0:600}"
            done
            exit 1
          }

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p dist
          cp "$(ls acetv/build/outputs/apk/release/*.apk | head -1)" dist/LiveChannels.apk
          TAG=live-channels-latest
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" dist/LiveChannels.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Live Channels (latest build)" \
            --notes "Ace Stream channels only. Build of ${GITHUB_SHA::7}. Needs Ace Stream Engine installed on the device."
