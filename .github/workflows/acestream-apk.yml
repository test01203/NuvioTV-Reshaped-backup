name: Ace Stream APK

# Builds an installable debug APK of this fork without the upstream's secrets: login and sync
# services stay unset, and the APK is signed with a key made for the run.
on:
  push:
    branches:
      - feat/acestream-iptv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acestream-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Optional repository secrets; whatever is unset stays off in the APK.
      - name: Configure build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
        run: |
          set -e
          cat > local.properties <<EOF
          TMDB_API_KEY=$TMDB_API_KEY
          NUVIO_SUPABASE_URL=$SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$SUPABASE_KEY
          AVATAR_PUBLIC_BASE_URL=${SUPABASE_URL:+${SUPABASE_URL%/}/storage/v1/object/public/avatars}
          TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID
          TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET
          PREMIUMIZE_CLIENT_ID=$PREMIUMIZE_CLIENT_ID
          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          DEVICE_LOGIN_WEB_BASE_URL=https://nuvio.tv/link
          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_APP_NAME=nuvio
          INTRODB_API_URL=https://api.introdb.app/
          IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/
          IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
          EOF
          [ -n "$TMDB_API_KEY" ] || echo "::warning::TMDB_API_KEY secret is not set: TMDB metadata will not load."
          cp local.properties local.dev.properties

          KEYSTORE_PATH="$RUNNER_TEMP/build.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" -storepass buildpass -keypass buildpass \
            -alias nuviotv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NuvioTV RS"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "NUVIO_RELEASE_STORE_PASSWORD=buildpass"
            echo "NUVIO_RELEASE_KEY_ALIAS=nuviotv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=buildpass"
          } >> "$GITHUB_ENV"

      - name: Live TV unit tests
        run: ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.reshaped.livetv.*' --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      # Each APK on its own, downloadable straight from the release page (no ZIP).
      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            src=$(ls app/build/outputs/apk/full/debug/*-"${abi}"-*.apk | head -1)
            cp "$src" "dist/NuvioTV-RS-${abi}.apk"
          done
          TAG=acestream-latest
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" dist/*.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "NuvioTV RS - Ace Stream (latest build)" \
            --notes "Build of ${GITHUB_SHA::7}. arm64-v8a: most Android TVs and boxes. armeabi-v7a: older 32-bit devices. x86_64 / x86: emulators such as BlueStacks."
